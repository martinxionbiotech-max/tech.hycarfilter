site_name: Hycarfilter Tech
site_description: >-
  Filter production technology / technical parameters / testing & quality control / industry standards — the industry standards layer that is searched and cited.
  Integrated industry knowledge + international standards framework, zero marketing, no overlap with the main site's marketing copy or the data site's product values.
site_url: https://tech.hycarfilter.com
repo_url: https://github.com/martinxionbiotech-max/tech.hycarfilter
repo_name: tech.hycarfilter
copyright: 'Qinghe County Huiying Auto Parts Co., Ltd. (清河县汇盈汽车零部件有限公司) · Unified Social Credit Code 91130534MA0958NT84'

theme:
  name: material
  language: en
  custom_dir: overrides
  palette:
    scheme: default
    primary: teal
    accent: teal
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.details
  - toc:
      permalink: true

plugins:
  - search

extra:
  version: 0.1.0

nav:
  - Home: index.md
  - Production Process:
      - Filter Media Types: production/filter-media.md
      - Pleating: production/pleating.md
      - End-Cap Bonding & Curing: production/endcap-bonding.md
      - Spin-On Assembly Line: production/spin-on-assembly.md
      - Category-Specific Lines: production/category-lines.md
      - Production Equipment: production/equipment.md
  - Technical Parameters:
      - Efficiency Grading Framework: parameters/efficiency-grading.md
      - Air Filter Key Parameters: parameters/air-filter-params.md
      - Oil Filter Key Parameters: parameters/oil-filter-params.md
      - Fuel Filter Key Parameters: parameters/fuel-filter-params.md
      - Cabin Filter Key Parameters: parameters/cabin-filter-params.md
      - Parameter Impact on Performance: parameters/parameter-performance.md
  - Testing & Quality Control:
      - Incoming Inspection (IQC): qc/incoming-inspection.md
      - In-Process Inspection (IPQC): qc/in-process.md
      - Final Inspection & Sampling (AQL): qc/final-inspection.md
      - Laboratory Equipment: qc/lab-equipment.md
      - Common Defects & Prevention: qc/defects-prevention.md
      - Export / Outgoing Inspection (OQC): qc/export-inspection.md
  - Industry Standards:
      - ISO / SAE Framework: standards/iso-sae.md
      - Export Market Differences: standards/export-market-diff.md
  - Technical Q&A: qa/index.md
